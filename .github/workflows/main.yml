name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check sw.js

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build and start site
        run: docker compose up -d --build --wait --wait-timeout 60

      - name: Check site and static assets
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --silent --show-error \
            http://localhost:8080/ \
            -o /tmp/kaniyo-index.html

          grep -q 'id="saveList"' /tmp/kaniyo-index.html

          for asset in app.js style.css sw.js icon.svg manifest.webmanifest; do
            curl --fail --silent --show-error \
              "http://localhost:8080/$asset" \
              -o /dev/null
          done

          status=$(curl --silent --output /dev/null \
            --write-out '%{http_code}' \
            http://localhost:8080/missing-file.txt)

          test "$status" = "404"

      - name: Show container logs
        if: failure()
        run: docker compose logs --no-color

      - name: Stop containers
        if: always()
        run: docker compose down --volumes --remove-orphans
