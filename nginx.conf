server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    location / {
        try_files $uri $uri/ =404;
    }

    # Ensure the browser checks for application and offline-cache updates.
    location ~ \.(html|js|css|webmanifest)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
}
